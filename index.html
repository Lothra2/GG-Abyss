<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GG Abyss" />
    <title>GG Abyss</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; background: #070a12; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #juego { position: fixed; inset: 0; overflow: hidden; background: #070a12; }
      #juego canvas { display: block; position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
      /* Aviso en HTML plano: solo para cuando el kit no está y todavía no hay fuentes del juego */
      #aviso { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 24px; text-align: center; background: #070a12; color: #e6e0d2; font: 600 20px/1.35 system-ui, sans-serif; z-index: 10; }
      #aviso.ver { display: flex; }
      #aviso small { font: 400 14px/1.4 system-ui, sans-serif; color: #9a9caa; max-width: 36em; }
      #aviso code { background: #1a1f2c; padding: 2px 6px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="juego"></div>
    <div id="aviso" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
