[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El kit cambia entre despliegues sin cambiar de nombre (el manifest, las hojas de las heroínas): el navegador
# lo guarda pero pregunta siempre si cambió (si no, es una respuesta corta 304 y no baja nada)
[[headers]]
  for = "/assets/kit/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
